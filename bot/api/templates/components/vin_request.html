{% set config = config if config is defined else {} %}
{% set vin_request = config.get('vin_request', {}) %}
<section id="vin-request" class="section">
  <div class="container">
    <h2>{{ vin_request.get('title') or 'Підбір по VIN' }}</h2>
    <p>{{ vin_request.get('text') or 'Залиште запит і ми підберемо потрібну деталь.' }}</p>
    <form class="cp-vin-card" data-cp-vin-form>
      <div class="cp-vin-fields">
        <input type="text" name="vehicle" placeholder="VIN / марка / модель" required>
        <input type="text" name="part" placeholder="Назва деталі" required>
        <input type="text" name="name" placeholder="Ваше ім'я">
        <input type="tel" name="phone" placeholder="Телефон для відповіді" required>
        <button type="submit" class="cp-btn cp-vin-submit">{{ vin_request.get('button_text') or 'Підібрати запчастину' }}</button>
      </div>
    </form>
  </div>
</section>
