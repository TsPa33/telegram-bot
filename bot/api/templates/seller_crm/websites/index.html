{% extends "seller_crm/base.html" %}{% block content %}<h1>Керування сайтами</h1><a href="/crm/seller/{{ account.crm_slug }}/websites/create">Create website</a>{% for w in websites %}<div><h3>{{ w.name }}</h3><p>Тип: {{ w.site_type }} | Статус: {{ w.status }} | URL: {{ w.subdomain }}.carpot.com.ua</p><a href="/crm/seller/{{ account.crm_slug }}/websites/{{ w.id }}">Manage</a> <a href="/w/{{ w.subdomain }}" target="_blank">Preview/Open</a></div>{% else %}<p>Ще немає сайтів V2.</p>{% endfor %}{% endblock %}
