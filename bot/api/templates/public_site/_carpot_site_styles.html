<style>
.carpot-site{--cp-black:#000;--cp-black-soft:#111;--cp-ink:#1f1f1f;--cp-bg:#f5f5f5;--cp-white:#fff;--cp-line:#e5e5e5;--cp-radius:16px;--cp-container:1200px;color:var(--cp-ink);background:var(--cp-white);font-family:Inter,Arial,sans-serif}
.carpot-site *{box-sizing:border-box}.carpot-container{max-width:var(--cp-container);margin:0 auto;padding:0 16px}.carpot-header{position:sticky;top:0;background:rgba(255,255,255,.95);border-bottom:1px solid var(--cp-line);z-index:30}.carpot-header-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}.carpot-brand{font-size:1.05rem;font-weight:800;color:var(--cp-black);text-decoration:none}.carpot-links{display:flex;gap:10px;flex-wrap:wrap}.carpot-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 18px;border:1px solid var(--cp-black);font-weight:600;text-decoration:none}.carpot-btn-primary{background:var(--cp-black);color:#fff}.carpot-btn-secondary{background:#fff;color:var(--cp-black)}
.carpot-hero{padding:44px 0;background:linear-gradient(180deg,#fff, var(--cp-bg))}.carpot-hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:stretch}.carpot-kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#666}.carpot-title{font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;margin:10px 0 14px;color:var(--cp-black)}.carpot-subtitle{color:#333;font-size:1.02rem;max-width:62ch}.carpot-banner{border:1px solid var(--cp-line);border-radius:20px;min-height:260px;background:#ddd center/cover no-repeat}
.carpot-section{padding:46px 0}.carpot-section-alt{background:var(--cp-bg)}.carpot-section h2{font-size:1.6rem;margin:0 0 12px;color:#000}.carpot-lead{color:#4b5563;max-width:72ch}.carpot-trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.carpot-pill{padding:13px 14px;border:1px solid var(--cp-line);border-radius:12px;background:#fff;font-weight:600}
.carpot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.carpot-card{background:#fff;border:1px solid var(--cp-line);border-radius:var(--cp-radius);overflow:hidden;display:flex;flex-direction:column}.carpot-card-image{aspect-ratio:4/3;background:#efefef;display:grid;place-items:center}.carpot-card-image img{width:100%;height:100%;object-fit:cover}.carpot-card-body{padding:14px}.carpot-card h3{font-size:1.05rem;margin:0 0 8px}.carpot-meta{font-size:.9rem;color:#555;min-height:2.4em}.carpot-price{font-weight:800;margin:10px 0;color:#000}.carpot-empty{padding:16px;border:1px dashed #bdbdbd;border-radius:12px;background:#fff}
.carpot-contact-list{display:grid;gap:8px}.carpot-footer{padding:24px 0;background:#111;color:#f3f3f3;margin-top:32px}.carpot-footer a{color:#fff}
@media (max-width:900px){.carpot-hero-grid{grid-template-columns:1fr}.carpot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.carpot-trust{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.carpot-grid,.carpot-trust{grid-template-columns:1fr}.carpot-header-row{align-items:flex-start;flex-direction:column}.carpot-links{width:100%}.carpot-links .carpot-btn{flex:1}}
</style>
