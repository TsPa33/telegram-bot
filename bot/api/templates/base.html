* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
}
.site-template{
    --section-padding-y: clamp(72px, 7vw, 96px);
    --section-padding-y-sm: clamp(44px, 6vw, 64px);
    --section-gap: clamp(14px, 2vw, 24px);
    --container-width: 1120px;
    --content-width: 920px;
    --section-pad: var(--section-padding-y);
    --section-pad-tight: var(--section-padding-y-sm);
    --hero-overlay: linear-gradient(180deg, rgba(2,6,23,.28) 0%, rgba(2,6,23,.72) 86%);
    --surface-2: color-mix(in srgb, var(--surface) 84%, var(--bg));
    --button-bg: var(--primary);
    --primary-hover: var(--primary-dark);
    --shadow: rgba(2,6,23,.18);

    /* template foundation tokens */
    --template-radius: 12px;
    --template-radius-sm: 8px;
    --template-radius-lg: 18px;
    --template-section-padding: clamp(72px, 7vw, 96px);
    --template-section-padding-sm: clamp(44px, 6vw, 64px);
    --template-card-padding: 16px;
    --template-card-gap: 12px;
    --template-shadow: 0 14px 34px color-mix(in srgb, var(--shadow) 70%, transparent);
    --template-shadow-hover: 0 18px 40px color-mix(in srgb, var(--shadow) 78%, transparent);
    --template-border-strength: 1px;
    --template-border-color: color-mix(in srgb, var(--border) 78%, transparent);
    --template-surface-opacity: 90%;
    --template-density: 1;
    --template-grid-gap: 12px;
    --template-hero-overlay: var(--hero-overlay);
    --template-hero-height: min(92vh, 780px);
    --template-button-height: 46px;
    --template-button-radius: 12px;
    --template-heading-spacing: -0.02em;
    --template-content-width: 920px;
}

/* CONTAINER */
.container {
    width: min(100%, var(--container-width, var(--container)));
    margin: 0 auto;
    padding: 0 20px;
}

/* HEADER */
.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.header-row {
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

.logo {
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 10px;
}

/* BURGER */
.menu-toggle {
    width: 44px;
    height: 44px;
    border: 1px solid var(--primary);
    border-radius: 12px;
    background: color-mix(in srgb, var(--header-bg) 82%, #000 18%);
    color: var(--card-text);

    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    gap: 5px;
    cursor: pointer;

    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
}

.menu-toggle span {
    width: 20px;
    height: 2px;
    border-radius: 999px;
    background: var(--card-text);
    transition: all 0.3s ease;
}

.theme-light_blue .menu-toggle {
    background: #ffffff;
    border-color: var(--border);
}

.theme-light_blue .menu-toggle span {
    background: #0f172a;
}

.theme-parts_dark_red .menu-toggle {
    background: #111827;
    border-color: #dc2626;
}

.theme-parts_dark_red .menu-toggle span {
    background: #ffffff;
}

.theme-electric_premium_dark .menu-toggle {
    background: #111827;
    border-color: #38bdf8;
}

.theme-electric_premium_dark .menu-toggle span {
    background: #ffffff;
}

.menu-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translate(4px, 4px);
}

.menu-toggle.active span:nth-child(2) {
    opacity: 0;
}

.menu-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
}

/* NAV */
.nav {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    background: var(--nav-bg);
}

.nav.open {
    max-height: calc(100vh - 62px);
    overflow-y: auto;
}

.nav-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.nav-link {
    display: block;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    background: var(--nav-bg);
}

/* ===== MODULAR SECTIONS ===== */

.cp-section-head {
    max-width: 720px;
    margin-bottom: clamp(24px, 4vw, 36px);
}

.cp-section-kicker {
    display: inline-flex;
    margin-bottom: 12px;
    padding: 7px 12px;
    border: 1px solid color-mix(in srgb, var(--primary) 45%, var(--border));
    border-radius: 999px;
    color: var(--primary);
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.cp-section-head h2 {
    margin: 0;
    color: var(--text);
    font-size: clamp(30px, 5vw, 54px);
    line-height: 1;
    letter-spacing: -0.045em;
}

.cp-section-head p {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: clamp(16px, 2vw, 18px);
    line-height: 1.65;
}

/* ===== SERVICES ===== */

.services-split {
    background: var(--dark);
    color: var(--on-dark);
    padding: 84px 0;
}

.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: center;
}

/* LEFT */
.left h2 {
    margin-bottom: 20px;
}

.left ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.service-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border: 1px solid color-mix(in srgb, var(--dark-border) 85%, transparent);
    border-radius: 16px;
    background: color-mix(in srgb, var(--dark-surface) 84%, transparent);
    cursor: pointer;
    transition: 0.22s ease;
    margin-bottom: 12px;
}

.service-item:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--primary) 58%, transparent);
    box-shadow: 0 14px 34px rgba(2, 6, 23, 0.18);
}

.service-item.active {
    color: var(--button-text);
    font-weight: 700;
    border-color: color-mix(in srgb, var(--primary) 66%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 26%, var(--dark-surface)), var(--dark-surface));
    box-shadow: 0 18px 38px color-mix(in srgb, var(--primary) 22%, transparent);
}

/* RIGHT */
.highlight {
    background: var(--dark-surface);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid var(--dark-border);
    transition: opacity 0.3s ease;
    box-shadow: 0 24px 56px rgba(2, 6, 23, 0.28);

    color: var(--card-text);
}

.highlight h3 {
    color: var(--card-text);
    margin: 0 0 10px;
    font-size: clamp(25px, 3vw, 34px);
    line-height: 1.1;
    letter-spacing: -0.03em;
}

.highlight p {
    color: var(--card-desc);
    margin: 0;
    font-size: 16px;
}

.service-price {
    display: inline-flex;
    margin-top: 12px;
    color: var(--accent, var(--primary));
    font-weight: 700;
}

.theme-electric_premium_dark .services-split {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.28), transparent 30%),
        radial-gradient(circle at 85% 0%, rgba(56, 189, 248, 0.16), transparent 34%),
        linear-gradient(180deg, #050816 0%, #08111f 52%, #050816 100%);
}

.theme-electric_premium_dark .services-split::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 58px 58px;
    mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 82%, transparent);
}

.theme-electric_premium_dark .services-split .container {
    position: relative;
    z-index: 1;
}

.theme-electric_premium_dark .left h2 {
    font-size: clamp(32px, 5vw, 56px);
    line-height: 1;
    margin: 0 0 24px;
    letter-spacing: -0.04em;
}

.theme-electric_premium_dark .service-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
    padding: 16px 18px;
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 18px;
    background: rgba(15, 23, 42, 0.62);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(16px);
}

.theme-electric_premium_dark .service-item::before {
    content: "⚡";
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: rgba(37, 99, 235, 0.22);
    color: #38bdf8;
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.18);
}

.theme-electric_premium_dark .service-item:hover,
.theme-electric_premium_dark .service-item.active {
    transform: translateX(0) translateY(-3px);
    border-color: rgba(56, 189, 248, 0.7);
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.28), rgba(15, 23, 42, 0.86));
    box-shadow: 0 18px 46px rgba(37, 99, 235, 0.18);
}

.theme-electric_premium_dark .highlight {
    position: relative;
    overflow: hidden;
    min-height: 330px;
    padding: 34px;
    border-color: rgba(56, 189, 248, 0.28);
    border-radius: 28px;
    background:
        linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(11, 16, 32, 0.78)),
        radial-gradient(circle at 90% 10%, rgba(56, 189, 248, 0.24), transparent 30%);
    box-shadow: 0 26px 80px rgba(2, 6, 23, 0.56), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
}

.theme-electric_premium_dark .highlight::before {
    content: "DIAGNOSTIC LIVE";
    display: inline-flex;
    margin-bottom: 28px;
    padding: 8px 12px;
    border: 1px solid rgba(56, 189, 248, 0.26);
    border-radius: 999px;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.08);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.12em;
}

.theme-electric_premium_dark .highlight h3 {
    margin: 0 0 14px;
    font-size: clamp(26px, 3vw, 40px);
    letter-spacing: -0.03em;
}

.theme-electric_premium_dark .highlight p {
    font-size: 17px;
    line-height: 1.7;
}

.theme-electric_premium_dark .btn-primary {
    border: 1px solid rgba(56, 189, 248, 0.42);
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    box-shadow: 0 14px 36px rgba(37, 99, 235, 0.32);
    font-weight: 800;
}

.theme-electric_premium_dark .btn-primary:hover {
    background: linear-gradient(135deg, #1d4ed8, #0284c7);
    box-shadow: 0 18px 46px rgba(56, 189, 248, 0.28);
    transform: translateY(-2px);
}

.electric-service-extras {
    position: relative;
    z-index: 1;
    margin-top: 34px;
}

.electric-section-title {
    margin: 0 0 16px;
    color: #ffffff;
    font-size: clamp(24px, 3vw, 36px);
    letter-spacing: -0.03em;
}

.electric-problems-grid,
.electric-trust-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.electric-problem,
.electric-trust-item {
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 18px;
    background: rgba(15, 23, 42, 0.58);
    color: #dbeafe;
    padding: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

.electric-problem strong,
.electric-trust-item strong {
    color: #ffffff;
}

.electric-diagnostic-cta {
    display: grid;
    grid-template-columns: 1.4fr auto;
    align-items: center;
    gap: 22px;
    margin: 34px 0;
    padding: 28px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 28px;
    background:
        radial-gradient(circle at 12% 25%, rgba(56, 189, 248, 0.18), transparent 28%),
        linear-gradient(135deg, rgba(37, 99, 235, 0.26), rgba(15, 23, 42, 0.82));
    box-shadow: 0 24px 70px rgba(37, 99, 235, 0.18);
}

.electric-diagnostic-cta h3 {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 42px);
}

.electric-diagnostic-cta p {
    margin: 0;
    color: #cbd5e1;
    font-size: 17px;
}

.electric-diagnostic-cta .btn-primary {
    margin-top: 0;
    white-space: nowrap;
}

.highlight.fade {
    opacity: 0.4;
}

.highlight-img {
    width: 100%;
    height: 220px;
    max-height: 260px;
    object-fit: contain;
    object-position: center;

{% set theme = config.get('design', {}).get('color_scheme_legacy', config.get('design', {}).get('color_scheme', 'dark_blue')) %}
<body class="theme-{{ theme }}">

{% block content %}{% endblock %}

{% include "components/analytics.html" %}
<script>
document.addEventListener("DOMContentLoaded", function () {

    /* BURGER */
    const btn = document.getElementById("menuToggle");
    const nav = document.getElementById("siteNav");

    if (btn && nav) {
        btn.onclick = () => {
            nav.classList.toggle("open");
            btn.classList.toggle("active");
        };

        document.querySelectorAll(".nav-link").forEach(link => {
            link.onclick = () => {
                nav.classList.remove("open");
                btn.classList.remove("active");
            };
        });
    }

    /* ===== SERVICES INTERACTIVE ===== */

    const items = document.querySelectorAll(".service-item");
    const title = document.getElementById("serviceTitle");
    const desc = document.getElementById("serviceDescription");
    const price = document.getElementById("servicePrice");
    const img = document.getElementById("serviceImage");
    const box = document.getElementById("serviceDisplay");

    if (!items.length || !title || !desc || !box) return;

    items.forEach(item => {
        item.addEventListener("click", () => {

            items.forEach(i => i.classList.remove("active"));
            item.classList.add("active");

            box.classList.add("fade");

            setTimeout(() => {

                title.textContent = item.dataset.title;
                desc.textContent = item.dataset.description || "";

                if (price) {
                    const priceLabel = item.dataset.priceLabel || (item.dataset.price ? `від ${item.dataset.price} грн` : "");
                    price.textContent = priceLabel;
                    price.style.display = priceLabel ? "inline-flex" : "none";
                }

                if (img && item.dataset.photo) {
                    img.src = item.dataset.photo;
                    img.style.display = "block";
                }

                if (img && !item.dataset.photo) {
                    img.style.display = "none";
                }

                box.classList.remove("fade");

            }, 150);
        });
    });

});
</script>

</body>
</html>
