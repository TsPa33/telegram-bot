# LOCAL verification only. Not a Railway import or production configuration.
name: carpot-warehouse-railway-check
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse_staging_test
      POSTGRES_USER: warehouse_check
      POSTGRES_PASSWORD: ${WAREHOUSE_STAGING_CHECK_PASSWORD:?Generate an ephemeral local test password}
    volumes: ["check_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_check -d warehouse_staging_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    image: carpot-warehouse-staging-backend
    build:
      context: ../..
      dockerfile: deploy/railway/backend.Dockerfile
    user: "0:0" # Exercise Railway's optional root-volume bootstrap and privilege drop.
    environment:
      PORT: "8010"
      WAREHOUSE_ENV: staging
      WAREHOUSE_COOKIE_SECURE: "true"
      WAREHOUSE_REGISTRATION_ENABLED: "false"
      WAREHOUSE_PUBLIC_ORIGIN: https://localhost:18443
      WAREHOUSE_DB_HOST: db
      WAREHOUSE_DB_NAME: warehouse_staging_test
      WAREHOUSE_DB_USER: warehouse_check
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_STAGING_CHECK_PASSWORD}
      WAREHOUSE_FORWARDED_ALLOW_IPS: 172.16.0.0/12,fd00::/8
      WAREHOUSE_PHOTO_DIR: /data/photos
    tmpfs: ["/data/photos:uid=0,gid=0"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8010/health', headers={'Host':'healthcheck.railway.app'}); urllib.request.urlopen(r)"]
      interval: 2s
      timeout: 5s
      retries: 60
  web:
    image: carpot-warehouse-staging-frontend
    build:
      context: ../..
      dockerfile: deploy/railway/frontend.Dockerfile
    environment:
      PORT: "8080"
      WAREHOUSE_PUBLIC_ORIGIN: https://localhost:18443
      WAREHOUSE_BACKEND_ORIGIN: http://api:8010
    depends_on:
      api: {condition: service_healthy}
  edge:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:18443:443"]
    volumes:
      - ./check-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.check:/tls:ro
    depends_on: [web]
  tests:
    image: carpot-warehouse-staging-backend
    profiles: ["test"]
    environment:
      WAREHOUSE_ENV: development
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://warehouse_check:${WAREHOUSE_STAGING_CHECK_PASSWORD}@db:5432/warehouse_staging_test
    volumes: ["../../backend/tests:/app/tests:ro"]
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  check_db:
