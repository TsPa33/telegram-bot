<!doctype html><html lang="uk"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#171717"/><title>CarPot Warehouse — управління складом</title><script>try{var t=localStorage.getItem("warehouse.theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;var n=localStorage.getItem("warehouse.nightStyle");document.documentElement.dataset.nightStyle=n==="gold"||n==="onyx"?n:"forest";}catch(e){var t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
