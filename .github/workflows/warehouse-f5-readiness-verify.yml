name: Warehouse f5 readiness regression
on:
  push:
    branches:
      - fix/warehouse-f5-readiness-gates
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warehouse-f5-readiness
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warehouse/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: warehouse/frontend
        run: npm ci
      - name: TypeScript and Vite production build
        working-directory: warehouse/frontend
        run: npm run build
      - name: Readiness gates regression
        working-directory: warehouse/frontend
        run: node --test tests/workshop-gate-unit.mjs tests/team-unit.mjs tests/smart-search-unit.mjs
      - name: All frontend unit tests
        working-directory: warehouse/frontend
        run: node --test tests/*-unit.mjs
