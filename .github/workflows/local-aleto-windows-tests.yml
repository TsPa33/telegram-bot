name: Local Aleto Windows Tests
on:
  push:
    branches:
      - feature/carpot-local-aleto-v11
    paths:
      - 'tools/local-aleto/**'
      - '.github/workflows/local-aleto-windows-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.15']
    defaults:
      run:
        working-directory: tools/local-aleto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and imports
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
