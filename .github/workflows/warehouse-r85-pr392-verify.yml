name: "PR392 isolated PostgreSQL verification"
on:
  pull_request:
    branches:
      - feature/carpot-warehouse-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr392-verification
  cancel-in-progress: true

jobs:
  backend-isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse_r85_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_r85_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://warehouse:warehouse@127.0.0.1:5432/warehouse_r85_test
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:warehouse@127.0.0.1:5432/warehouse_r85_test
      WAREHOUSE_COOKIE_SECURE: "false"
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r warehouse/backend/requirements.txt
      - name: Verify alembic head, upgrade on empty PostgreSQL
        working-directory: warehouse/backend
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic current
      - name: Run model-scope and managed plan tests
        working-directory: warehouse/backend
        run: python -m pytest -q tests/test_dismantling_v2.py tests/test_dismantling_plan_v3.py tests/test_dismantling_preview.py
      - name: Run full backend regression
        working-directory: warehouse/backend
        run: python -m pytest -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: warehouse/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: warehouse/frontend
        run: npm ci
      - name: TypeScript and production build
        working-directory: warehouse/frontend
        run: npm run build
