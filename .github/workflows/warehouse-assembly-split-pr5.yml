name: Warehouse assembly split (isolated DB)

on:
  pull_request:
    paths:
      - "warehouse/**"
      - ".github/workflows/warehouse-assembly-split-pr5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend physical assembly / sales
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_assembly_test
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_assembly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://warehouse:testonly@127.0.0.1:5432/warehouse_assembly_test
    defaults:
      run:
        working-directory: warehouse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run isolated inventory / assembly regressions
        run: python -m pytest -q tests/test_assemblies.py tests/test_assembly_split.py

  frontend:
    name: Frontend build and component selection
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warehouse/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
