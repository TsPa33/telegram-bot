name: CarPot Billing local financial foundation
on:
  pull_request:
    paths:
      - 'bot/billing/**'
      - 'docs/billing/**'
      - '.github/workflows/carpot-billing-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r bot/billing/requirements-test.txt
      - run: python -m bot.billing.run_fixture_tests
