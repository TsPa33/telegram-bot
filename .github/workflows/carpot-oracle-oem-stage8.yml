name: CarPot Oracle Stage 8 read-only OEM audit
on:
  push:
    branches:
      - feature/carpot-oem-stage8-readonly-audit-20261123
    paths:
      - catalogue/**
      - .github/workflows/carpot-oracle-oem-stage8.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: catalogue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate Stage 7 and Stage 8 Oracle source contracts
        run: python -m pytest -q tests/test_stage8_live_oem_audit.py tests/test_oracle_vehicle_discovery_stage7.py tests/test_oracle_adapter_stage2.py tests/test_oracle_gateway_stage3.py --maxfail=1
