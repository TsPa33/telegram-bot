name: R11.1 Search quick edit CI
on:
  push:
    branches: [feature/warehouse-search-r11-1-quick-edit]
permissions:
  contents: read
concurrency:
  group: warehouse-r11-1-quick-edit
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warehouse/frontend/package-lock.json
      - name: Install
        working-directory: warehouse/frontend
        run: npm ci
      - name: Build
        working-directory: warehouse/frontend
        run: npm run build
      - name: Build Railway API container with secure photo entrypoint
        run: docker build -t warehouse-r11-api -f deploy/railway/backend.Dockerfile warehouse
      - name: Verify unprivileged API photo mount write
        run: |
          docker volume create warehouse-r11-test
          docker run --rm -e WAREHOUSE_PHOTO_DIR=/data/photos -v warehouse-r11-test:/data/photos warehouse-r11-api python -c "from pathlib import Path; import os; assert os.geteuid()==1000; Path('/data/photos/probe').write_text('ok')"
          docker volume rm warehouse-r11-test
      - name: All frontend unit tests
        working-directory: warehouse/frontend
        run: node --test tests/*-unit.mjs
