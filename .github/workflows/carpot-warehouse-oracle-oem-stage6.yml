name: CarPot Oracle OEM — isolated staging regression
on:
  push:
    branches:
      - feature/carpot-warehouse-oracle-auto-oem-stage6-20261122
      - fix/carpot-warehouse-oracle-timeout-stage6b-20261122
    paths:
      - warehouse/backend/**
      - .github/workflows/carpot-warehouse-oracle-oem-stage6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-oem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: warehouse_oracle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_oracle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://warehouse:testonly@127.0.0.1:5432/warehouse_oracle_test
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:testonly@127.0.0.1:5432/warehouse_oracle_test
      WAREHOUSE_ORACLE_OEM_ENABLED: "false"
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: "false"
    defaults:
      run:
        working-directory: warehouse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run only Oracle + existing OEM regressions
        run: python -m pytest -q tests/test_oracle_oem_auto.py tests/test_unified_catalogue.py tests/test_oem_diagnostics.py --maxfail=1
