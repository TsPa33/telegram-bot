name: R11 Search UX checks
on:
  push:
    branches:
      - feature/warehouse-search-r11-premium
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-r11-frontend
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: warehouse/frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: warehouse/frontend
        run: npm ci
      - name: TypeScript and Vite production build
        working-directory: warehouse/frontend
        run: npm run build
      - name: Search and query regression
        working-directory: warehouse/frontend
        run: node --test tests/parts-search-query-unit.mjs tests/smart-search-unit.mjs
      - name: All frontend unit tests
        working-directory: warehouse/frontend
        run: node --test tests/*-unit.mjs
