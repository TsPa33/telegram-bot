name: CarPot Billing Phase 2.1 full release gate
on:
  pull_request:
    paths:
      - 'bot/billing/**'
      - 'warehouse/backend/**'
      - 'warehouse/frontend/**'
      - 'docs/billing/v2/**'
      - 'docs/billing/v2.1/**'
      - '.github/workflows/carpot-billing-phase2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r bot/billing/requirements-test.txt
      - run: python -m bot.billing.run_fixture_tests
      - name: Build isolated API image without acceptance drivers
        run: |
          docker build -f bot/billing/Dockerfile -t carpot-billing-api:ci .
          docker run --rm --entrypoint python carpot-billing-api:ci -c "from pathlib import Path; import bot.billing.api; assert not Path('/app/bot/billing/tests').exists()"
  warehouse-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_ci_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_ci_test
      CARPOT_BILLING_TEST_DSN: host=127.0.0.1 port=5432 dbname=carpot_billing_ci_test user=postgres password=isolated-ci-fixture
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r warehouse/backend/requirements.txt psycopg2-binary==2.9.9
      - name: Prepare finance DB on this disposable service only
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=isolated-ci-fixture dbname=warehouse_ci_test',autocommit=True) as c:
              c.execute('CREATE DATABASE carpot_billing_ci_test')
          PY
      - name: Full backend including Phase 2
        working-directory: warehouse/backend
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/warehouse/backend'
        run: python -m pytest tests unit_tests -q --tb=short --junitxml=phase2-full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: warehouse-full-results, path: warehouse/backend/phase2-full.xml}
  frontend-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_browser_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_browser_test
      CARPOT_BILLING_TEST_DSN: host=127.0.0.1 port=5432 dbname=carpot_billing_browser_test user=postgres password=isolated-ci-fixture
      WAREHOUSE_ENV: local
      WAREHOUSE_COOKIE_SECURE: 'false'
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: 'false'
      WAREHOUSE_ENTITLEMENTS_ENABLED: 'true'
      WAREHOUSE_ENTITLEMENT_TEST_KEY: ci-fixture-only-key-not-a-production-credential-12345
      WAREHOUSE_TEST_PYTHON: python
      WAREHOUSE_API_PROXY: http://127.0.0.1:8012
      PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/warehouse/backend'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r warehouse/backend/requirements.txt psycopg2-binary==2.9.9
      - run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=isolated-ci-fixture dbname=warehouse_browser_test',autocommit=True) as c:
              c.execute('CREATE DATABASE carpot_billing_browser_test')
          PY
      - run: npm ci
        working-directory: warehouse/frontend
      - run: node --test tests/*unit*.mjs
        working-directory: warehouse/frontend
      - run: npm run build
        working-directory: warehouse/frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: warehouse/frontend
      - run: python -m alembic upgrade head
        working-directory: warehouse/backend
      - name: Start local fixture servers
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8012 > /tmp/phase2-api.log 2>&1 &
          cd warehouse/frontend
          npm run dev -- --port 5226 --strictPort > /tmp/phase2-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5226/health; then break; fi
            sleep 1
          done
      - run: node tests/billing-phase2-browser.mjs
        working-directory: warehouse/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-phase2-browser-evidence
          path: |
            warehouse/docs/billing-phase2/screenshots
            /tmp/phase2-api.log
            /tmp/phase2-ui.log

  corporate-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_corporate_ux_test
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_corporate_ux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:testonly@127.0.0.1:5432/warehouse_corporate_ux_test
      WAREHOUSE_COOKIE_SECURE: "false"
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: "false"
      WAREHOUSE_REGISTRATION_ENABLED: "true"
      WAREHOUSE_E2E: "1"
      WAREHOUSE_ENV: "local"
      PLAN_PARTS_ENABLED: "false"
      ASSEMBLY_INVENTORY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and migrate disposable database
        working-directory: warehouse/backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/ux-api.log 2>&1 &
      - name: Build and run browser checks
        working-directory: warehouse/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 5251 > /tmp/ux-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5251/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5251/health
          node tests/corporate-ux-v2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corporate-ux-v2-browser
          path: |
            /tmp/corporate-ux-v2
            /tmp/ux-api.log
            /tmp/ux-vite.log

  integrated-browser:
    name: Integrated dismantling → stock → checkout (isolated browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse_dismantling_v2_browser_test
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: testonly
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_dismantling_v2_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://warehouse:testonly@127.0.0.1:55441/warehouse_dismantling_v2_browser_test
      WAREHOUSE_ENV: "local"
      WAREHOUSE_COOKIE_SECURE: "false"
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: "false"
      WAREHOUSE_REGISTRATION_ENABLED: "true"
      WAREHOUSE_E2E: "1"
      PLAN_PARTS_ENABLED: "false"
      ASSEMBLY_INVENTORY_ENABLED: "true"
      WAREHOUSE_API_PROXY: http://127.0.0.1:8060
      DV2_OUTPUT: /tmp/dv2-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and migrate dedicated localhost test database
        working-directory: warehouse/backend
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m alembic upgrade head
          PYTHONPATH=. python -m uvicorn dismantling_v2_browser_server:app --app-dir tests --host 127.0.0.1 --port 8060 > /tmp/dv2-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8060/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8060/health
      - name: Production build and authenticated integrated browser QA
        working-directory: warehouse/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm run build
          npm run preview -- --host 127.0.0.1 --port 5260 --strictPort > /tmp/dv2-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5260/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5260/health
          WAREHOUSE_SALES_ORIGIN=http://127.0.0.1:5260 node tests/sales-browser.mjs
          node tests/dismantling-v2-browser.mjs
          UX_POLISH_ORIGIN=http://127.0.0.1:5260 node tests/integrated-ux-browser.mjs
          node tests/mobile-search-checkout-browser.mjs
          V23_ORIGIN=http://127.0.0.1:5260 node tests/mobile-search-v23-browser.mjs
          V23_ENGINE=webkit V23_ORIGIN=http://127.0.0.1:5260 node tests/mobile-search-v23-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-dismantling-v2-browser
          path: |
            /tmp/mobile-v23-browser
            /tmp/mobile-search-checkout
            /tmp/integrated-ux-browser
            /tmp/dv2-browser
            /tmp/dv2-api.log
            /tmp/dv2-vite.log

  global-billing-browser:
    name: Global Billing synthetic two-service checkout (Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_global_browser_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_global_browser_test
      CARPOT_BILLING_BROWSER_DSN: host=127.0.0.1 port=5432 dbname=carpot_billing_global_browser_test user=postgres password=isolated-ci-fixture
      WAREHOUSE_ENV: local
      WAREHOUSE_COOKIE_SECURE: 'false'
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: 'false'
      WAREHOUSE_E2E: '1'
      WAREHOUSE_GLOBAL_BILLING_ENABLED: 'true'
      WAREHOUSE_BILLING_ENVIRONMENT: sandbox
      WAREHOUSE_GLOBAL_BILLING_MODE: enforce
      WAREHOUSE_BILLING_API_URL: https://billing.example.test
      WAREHOUSE_BILLING_SERVICE_KEY: global-browser-synthetic-peer-secret-123456789
      BILLING_BROWSER_FIXTURE_KEY: local-browser-driver-secret-123456789
      WAREHOUSE_API_PROXY: http://127.0.0.1:8421
      GLOBAL_BILLING_ORIGIN: http://127.0.0.1:5255
      PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/warehouse/backend'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r warehouse/backend/requirements.txt psycopg2-binary==2.9.9
      - name: Prepare isolated Finance DB
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=isolated-ci-fixture dbname=warehouse_global_browser_test',autocommit=True) as c:
              c.execute('CREATE DATABASE carpot_billing_global_browser_test')
          PY
      - run: python -m alembic upgrade head
        working-directory: warehouse/backend
      - run: npm ci
        working-directory: warehouse/frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: warehouse/frontend
      - name: Start explicitly local-only browser drivers
        run: |
          cd warehouse/backend
          python -m uvicorn global_browser_warehouse:app --app-dir tests --host 127.0.0.1 --port 8421 > /tmp/global-billing-api.log 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 --port 5255 --strictPort > /tmp/global-billing-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5255/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5255/health
      - run: node tests/billing-global-browser.mjs
        working-directory: warehouse/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-billing-synthetic-browser-evidence
          path: |
            /tmp/carpot-global-billing
            /tmp/global-billing-api.log
            /tmp/global-billing-ui.log
