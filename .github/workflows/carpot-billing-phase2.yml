name: CarPot Billing Phase 2 independent acceptance
on:
  pull_request:
    paths:
      - 'bot/billing/**'
      - 'warehouse/backend/**'
      - 'warehouse/frontend/**'
      - 'docs/billing/v2/**'
      - '.github/workflows/carpot-billing-phase2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r bot/billing/requirements-test.txt
      - run: python -m bot.billing.run_fixture_tests
  warehouse-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_ci_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_ci_test
      CARPOT_BILLING_TEST_DSN: host=127.0.0.1 port=5432 dbname=carpot_billing_ci_test user=postgres password=isolated-ci-fixture
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r warehouse/backend/requirements.txt psycopg2-binary==2.9.9
      - name: Prepare finance DB on this disposable service only
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=isolated-ci-fixture dbname=warehouse_ci_test',autocommit=True) as c:
              c.execute('CREATE DATABASE carpot_billing_ci_test')
          PY
      - name: Full backend including Phase 2
        working-directory: warehouse/backend
        env:
          PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/warehouse/backend'
        run: python -m pytest tests -q --tb=short --junitxml=phase2-full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: warehouse-full-results, path: warehouse/backend/phase2-full.xml}
  warehouse-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_baseline_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_baseline_test
    steps:
      - uses: actions/checkout@v4
        with: {ref: '6cc2ee9d76bbb766371cae8fcc3adb169940b79c', fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r warehouse/backend/requirements.txt
      - name: Untouched Phase 1 baseline full backend
        working-directory: warehouse/backend
        run: python -m pytest tests -q --tb=short --junitxml=baseline-full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: baseline-full-results, path: warehouse/backend/baseline-full.xml}
  frontend-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-ci-fixture, POSTGRES_DB: warehouse_browser_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-fixture@127.0.0.1:5432/warehouse_browser_test
      CARPOT_BILLING_TEST_DSN: host=127.0.0.1 port=5432 dbname=carpot_billing_browser_test user=postgres password=isolated-ci-fixture
      WAREHOUSE_ENV: local
      WAREHOUSE_COOKIE_SECURE: 'false'
      WAREHOUSE_CATALOGUE_WORKER_ENABLED: 'false'
      WAREHOUSE_ENTITLEMENTS_ENABLED: 'true'
      WAREHOUSE_ENTITLEMENT_TEST_KEY: ci-fixture-only-key-not-a-production-credential-12345
      WAREHOUSE_TEST_PYTHON: python
      WAREHOUSE_API_PROXY: http://127.0.0.1:8012
      PYTHONPATH: '${{ github.workspace }}:${{ github.workspace }}/warehouse/backend'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r warehouse/backend/requirements.txt psycopg2-binary==2.9.9
      - run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=isolated-ci-fixture dbname=warehouse_browser_test',autocommit=True) as c:
              c.execute('CREATE DATABASE carpot_billing_browser_test')
          PY
      - run: npm ci
        working-directory: warehouse/frontend
      - run: node --test tests/*unit*.mjs
        working-directory: warehouse/frontend
      - run: npm run build
        working-directory: warehouse/frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: warehouse/frontend
      - run: python -m alembic upgrade head
        working-directory: warehouse/backend
      - name: Start local fixture servers
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8012 > /tmp/phase2-api.log 2>&1 &
          cd warehouse/frontend
          npm run dev -- --port 5226 --strictPort > /tmp/phase2-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5226/health; then break; fi
            sleep 1
          done
      - run: node tests/billing-phase2-browser.mjs
        working-directory: warehouse/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-phase2-browser-evidence
          path: |
            warehouse/docs/billing-phase2/screenshots
            /tmp/phase2-api.log
            /tmp/phase2-ui.log
